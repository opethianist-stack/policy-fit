  }

  /* ---------- 정책 근거 선택 ---------- */
  // 역할 = 제안서 추진 배경 절에서 이 근거가 받치는 칸. 순서가 문서의 논증 순서다. (lib/roles.js 와 같게 유지)
  var ROLES = [
    { key: 'policy', label: '정책 기조', side: '정책·제도 측' },
    { key: 'tech', label: '기술·환경', side: '기술·환경 측' },
    { key: 'demand', label: '현장 수요', side: '현장 수요 측' },
    { key: 'agency', label: '발주기관 계획', side: '발주기관 측' }
  ];
  var MARKS = ['가', '나', '다', '라'];
  function roleLabel(k) { for (var i = 0; i < ROLES.length; i++) if (ROLES[i].key === k) return ROLES[i].label; return ''; }

  // 검색 결과 = 후보. 담당자가 쓸 것만 선택한다(선택 안 한 것은 문서에 안 들어간다). 검색 화면과 이 화면이 같은 선택 상태를 쓴다.
  var CARDS = [];
  var cur = 0;
  var HEAD = {}, CONCL = '';
  // ---- AI(LLM) 보조: 버튼을 눌렀을 때만 부르고, 서버가 검증한 칸만 받는다 ----
  var AI = { sug: [] }, AIF = { head: {}, concl: false }, COPY = null;
  function aiPost(body) {
    return fetch('/api/ai', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: '응답을 읽지 못했습니다.' }; }); })
      .catch(function () { return { ok: false, error: '서버에 연결하지 못했습니다.' }; });
  }
  function aiRun(btnId, msgId, body, onOk) {
    var btn = $(btnId), label = btn.textContent, t0 = Date.now();
    btn.disabled = true; btn.textContent = 'AI 작업 중'; $(msgId).textContent = ''; $(msgId).className = 'ai-msg';
    // 기다리는 동안 경과 초를 보여 준다(관련도 정렬·초안은 10초 안팎 걸린다)
    var tick = setInterval(function () { var b = $(btnId); if (b && b.disabled) b.textContent = 'AI 작업 중 ' + Math.round((Date.now() - t0) / 1000) + '초'; }, 1000);
    return aiPost(body).then(function (d) {
      clearInterval(tick);
      var b = $(btnId); if (b) { b.disabled = false; b.textContent = label; }
      var m = $(msgId); if (!m) return;
      if (!d.ok) { m.className = 'ai-msg err'; m.textContent = d.error || 'AI 처리에 실패했습니다.'; return; }
      var drop = d.dropped || [];
      // 뺀 항목은 눌러서 펼친다(마우스 올림만으로는 모바일에서 안 보인다)
      m.innerHTML = esc(onOk(d) || '') + (drop.length ? ' · <details class="ai-drop"><summary>검증에서 뺀 항목 ' + drop.length + '개</summary><ul>' +
        drop.map(function (x) { return '<li>' + esc((x.where || x.term || x.id || '') + ': ' + x.reason) + '</li>'; }).join('') + '</ul></details>' : '');
    });
  }
  function aiTerms() {
    return aiRun('ai-terms-btn', 'ai-terms-msg', {
      task: 'terms', title: S.notice.name, terms: S.terms, orgs: (S.lineage.chain || []).map(function (c) { return c.name; }),
      rfpText: S.rfp && S.rfp.text ? S.rfp.text.slice(0, 8000) : '',
    }, function (d) { AI.sug = d.terms; renderSug(); return d.terms.length ? '눌러서 추가' : '추가할 후보가 없습니다'; });
  }
  // 키워드 후보를 넓게(30건) 받아 AI가 사업 관련도로 다시 줄 세운다. 발췌·문서는 그대로, 순서와 이유만 바뀐다
  function aiRank() {
    if (!S.notice || !S.lineage || !S.terms.length) return;
    var my = seq, btn = $('ai-rank-btn');
    btn.disabled = true; btn.textContent = '후보 모으는 중'; $('ai-rank-msg').textContent = ''; $('ai-rank-msg').className = 'ai-msg';
    var params = evParams(); params.terms = S.terms.join(','); params.limit = 20;
    return api('/api/evidence', params).then(function (ev) {
      btn.disabled = false; btn.textContent = 'AI 관련도 정렬';
      if (my !== seq) return;
      if (!ev.ok || !ev.results.length) { $('ai-rank-msg').textContent = '정렬할 후보가 없습니다'; return; }
      var by = {}; ev.results.forEach(function (r) { by[r.id] = r; });
      return aiRun('ai-rank-btn', 'ai-rank-msg', {
        task: 'rank', notice: S.notice, lineage: S.lineage, rfpText: S.rfp && S.rfp.text ? S.rfp.text.slice(0, 3000) : '', candidates: ev.results,
      }, function (d) {
        if (my !== seq) return '';
        S.results = d.ranked.filter(function (x) { return by[x.id]; }).map(function (x) { var r = {}; for (var k in by[x.id]) r[k] = by[x.id][k]; r.aiScore = x.score; r.aiWhy = x.why; return r; });
        $('result-count').textContent = '관련도순 ' + S.results.length + '건 · 후보 ' + d.candidates + '건';
        syncCards(); renderTerms(); renderGrid(); repaintSteps();
        return '후보 ' + d.candidates + '건을 관련도순으로 정렬' + (d.hidden.length ? ' · 관련 없음 ' + d.hidden.length + '건 제외' : '');
      });
    });
  }
  function renderSug() {
    $('ai-sug').innerHTML = AI.sug.map(function (x, i) {
      return '<button class="chip" onclick="addSug(' + i + ')" title="색인 ' + x.pages + '쪽">+ ' + esc(x.term) + '</button>';
    }).join('');
  }
  function addSug(i) {
    if (S.terms.length >= MAX_TERMS) { SWAP = { term: AI.sug[i].term, sug: i }; renderTerms(); return; }
    var t = AI.sug[i].term; AI.sug.splice(i, 1); renderSug();
    if (S.terms.indexOf(t) < 0) { S.terms.push(t); runEvidence(false); }
  }
  function aiRoles() {
    var body = payload();
    if (!body.cards.length) { $('ai-roles-msg').textContent = '선택한 근거가 없습니다'; return; }
    return aiRun('ai-roles-btn', 'ai-roles-msg', { task: 'roles', cards: body.cards, lineage: S.lineage, notice: S.notice }, function (d) {
      d.roles.forEach(function (x) { var c = cardOf(x.id); if (c) { c.role = x.role; c.aiWhy = x.why || ''; } });
      renderReview();
      return '선택한 근거 ' + d.roles.length + '건의 역할을 바꿨습니다';
    });
  }
  function aiDraft() {
    var body = payload(); body.task = 'draft';
    return aiRun('ai-draft-btn', 'ai-draft-msg', body, function (d) {
      var n = 0;
      d.sentences.forEach(function (x) { var c = cardOf(x.id); if (c && !String(c.text || '').trim()) { c.text = x.text; c.aiText = true; n++; } });
      d.headlines.forEach(function (x) { if (!String(HEAD[x.role] || '').trim()) { HEAD[x.role] = x.text; AIF.head[x.role] = true; n++; } });
      if (d.conclusion && !String(CONCL || '').trim()) { CONCL = d.conclusion; AIF.concl = true; n++; }
      renderWork(); queueDraft();
      return n ? '빈 칸 ' + n + '개를 채웠습니다(보라색 칸)' : '채울 빈 칸이 없습니다';
    });
  }
  function aiDeck() {
    var body = payload(); body.task = 'deck';
    return aiRun('ai-deck-btn', 'ai-deck-msg', body, function (d) {
      COPY = { title: {}, summary: {} };
      d.cells.forEach(function (x) { if (x.title) COPY.title[x.id] = x.title; if (x.summary) COPY.summary[x.id] = x.summary; });
      if (d.headline) { DECKHL[0] = d.headline[0]; DECKHL[1] = d.headline[1]; DECKHL.edited = true; $('deck-h1').value = DECKHL[0]; $('deck-h2').value = DECKHL[1]; }
      loadDraft(); paintDeck();
      if (!d.cells.length && !d.headline) return '바꿀 수 있는 칸이 없습니다';
      return (d.cells.length ? '칸 ' + d.cells.length + '개' : '') + (d.cells.length && d.headline ? '와 ' : '') + (d.headline ? '헤드라인' : '') + '을 바꿨습니다';
    });
  }

  function cardOf(id) { for (var i = 0; i < CARDS.length; i++) if (CARDS[i].r.id === id) return CARDS[i]; return null; }
  // 검색어·범위를 바꿔 다시 찾으면 후보가 바뀐다. 이미 선택하거나 고친 카드는 결과에서 빠져도 유지한다.
  function syncCards() {
    var keep = CARDS.filter(function (c) { return c.sel; });
    var next = S.results.map(function (r) {
      return cardOf(r.id) || { r: r, sel: false, role: r.role || 'policy', text: '', page: r.page, quote: r.quote, orig: { page: r.page, quote: r.quote } };
    });
    keep.forEach(function (c) { if (next.indexOf(c) < 0) next.push(c); });
    CARDS = next;
    if (cur >= CARDS.length) cur = 0;
  }
  function selCount() { return CARDS.filter(function (c) { return c.sel; }).length; }
  function renderPickCount() {
    var n = selCount();
    $('to-review').disabled = !CARDS.length;
    $('to-review').textContent = n ? '선택한 ' + n + '건 확인' : '정책 근거 선택';
  }
  function toggleSel(id) {
    var c = cardOf(id); if (!c) return;
    c.sel = !c.sel;
    renderGrid(); repaintSteps();
    if ($('s-chat').classList.contains('on')) renderReview();
  }
  function startReview() {
    var first = -1;
    for (var i = 0; i < CARDS.length; i++) if (CARDS[i].sel) { first = i; break; }
    cur = first >= 0 ? first : 0;
    renderReview();
    go('chat');
  }
  function setRole(k) { CARDS[cur].role = k; CARDS[cur].aiWhy = ''; renderReview(); }
  function pick(i) { cur = i; renderReview(); loadSrc(); }
  function toggleCur() { var c = CARDS[cur]; if (c) toggleSel(c.r.id); }
  function stepCur(d) { if (!CARDS.length) return; cur = (cur + d + CARDS.length) % CARDS.length; renderReview(); loadSrc(); }

  function renderReview() {
    if (!CARDS.length) {
      $('rv-count').textContent = '정책 근거 선택';
      $('rv-card').innerHTML = '<div class="meta">정책 근거 검색을 먼저 진행해 주세요.</div>';
      $('rv-list').innerHTML = ''; $('rv-next').disabled = true; $('rv-next').textContent = '사업 이해도 문서 산출'; return;
    }
    var c = CARDS[cur], r = c.r, n = selCount();
    $('rv-count').textContent = '후보 ' + CARDS.length + '건 · 선택 ' + n + '건';
    $('rv-card').innerHTML =
      '<div class="doc-title" style="margin-bottom:8px;">' + esc(r.org + ' ' + r.title) + ' · ' + esc(r.year) + ' · p.' + c.page + (r.pageEstimated ? '<span class="tag">쪽 확인</span>' : '') + '</div>' +
      '<div class="badge-ok" style="margin-bottom:10px;">' + ICON_OK + '원문 일치 확인</div>' +
      '<div class="quote" style="margin-bottom:12px;">' + mark(c.quote, r.matched) + '</div>' +
      (c.sel ? '<div class="sec-label" style="margin-bottom:6px;">역할</div>' +
        '<div class="roles">' + ROLES.map(function (x) {
          return '<button class="' + (c.role === x.key ? 'on' : '') + '" onclick="setRole(\'' + x.key + '\')">' + x.label + '</button>';
        }).join('') + '</div>' + (c.aiWhy ? '<div class="ai-why">AI 분류: ' + esc(c.aiWhy) + '</div>' : '') : '') +
      '<div style="display:flex;gap:8px;">' +
        '<button class="btn soft" style="min-height:36px;padding:0 12px;" onclick="stepCur(-1)" aria-label="이전 후보">‹</button>' +
        '<button class="btn ' + (c.sel ? 'soft' : 'primary') + '" style="flex:1;min-height:36px;" onclick="toggleCur()">' + (c.sel ? '선택 해제' : '이 근거 선택') + '</button>' +
        '<button class="btn soft" style="min-height:36px;padding:0 12px;" onclick="stepCur(1)" aria-label="다음 후보">›</button>' +
      '</div>';
    $('rv-list').innerHTML = CARDS.map(function (x, i) {
      return '<div class="rv-row">' +
        '<button class="box' + (x.sel ? ' on' : '') + '" onclick="toggleSel(\'' + esc(x.r.id) + '\')" aria-label="선택"></button>' +
        '<button onclick="pick(' + i + ')" style="flex:1;min-width:0;text-align:left;font-size:12px;color:var(--slate);' + (i === cur ? 'font-weight:700;color:var(--ink);' : '') + '">' + esc(x.r.org + ' ' + x.r.title) + ' · p.' + x.page + '</button>' +
        (x.sel ? '<span class="meta" style="flex-shrink:0;">' + esc(roleLabel(x.role)) + '</span>' : '') +
      '</div>';
    }).join('');
    $('rv-next').disabled = !n;
    $('rv-next').textContent = n ? '선택한 ' + n + '건으로 문서 산출' : '사용할 근거를 선택해 주세요';
  }

  /* ---------- 원문 쪽 보기 ---------- */
  var V = { key: '', data: null, page: 0 };
  function loadSrc(page) {
    var c = CARDS[cur];
    if (!c) { $('src-title').textContent = ''; $('src-page').textContent = ''; $('src-body').textContent = ''; $('src-hint').textContent = ''; return; }
    var pg = page || c.page;
    var key = c.r.docId + '|' + pg + '|' + (pg === c.page ? c.quote : '');
    if (key === V.key) return;
    V.key = key;
    $('src-title').textContent = c.r.org + ' 「' + c.r.title + '」 ' + c.r.year;
    $('src-body').innerHTML = '<span class="meta">원문을 불러오고 있습니다.</span>';
    api('/api/page', { doc: c.r.docId, page: pg, quote: pg === c.page ? c.quote : '' }).then(function (d) {
      if (V.key !== key) return;
      if (!d.ok) { V.data = null; $('src-body').innerHTML = '<span class="state-msg err">' + esc(d.error || '원문을 불러오지 못했습니다.') + '</span>'; return; }
      V.data = d; V.page = d.page;
      var t = d.text;
      $('src-body').innerHTML = cells(d.hit
        ? esc(t.slice(0, d.hit[0])) + '<mark id="src-mark">' + esc(t.slice(d.hit[0], d.hit[1])) + '</mark>' + esc(t.slice(d.hit[1]))
        : esc(t));
      $('src-body').scrollTop = 0;
      var m = $('src-mark'); if (m) m.scrollIntoView({ block: 'center' });
      $('src-page').textContent = 'p.' + d.page;
      $('src-prev').disabled = d.prev == null; $('src-next').disabled = d.next == null;
      $('src-hint').innerHTML = d.page !== c.page ? '카드 발췌 쪽: p.' + c.page
        : (d.pageEstimated ? '쪽 번호 추정(±1쪽) · 원본과 대조 필요' : '');
      $('src-reset').style.display = (c.page !== c.orig.page || c.quote !== c.orig.quote) ? '' : 'none';
      $('src-use').disabled = true;
    });
  }
  function srcMove(dir) { if (V.data && V.data[dir] != null) loadSrc(V.data[dir]); }
  function selectedText() {
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return '';
    var box = $('src-body');
    if (!box.contains(sel.anchorNode) || !box.contains(sel.focusNode)) return '';
    return sel.toString().replace(/\s+/g, ' ').trim();
  }
  function srcSel() { var t = selectedText(); $('src-use').disabled = !(t.length >= 10 && t.length <= 600 && V.data); }
  function useSelection() {
    var t = selectedText(), c = CARDS[cur];
    if (!t || !V.data || !c) return;
    c.quote = t; c.page = V.page;
    V.key = ''; renderReview(); loadSrc();
  }
  function resetQuote() { var c = CARDS[cur]; c.page = c.orig.page; c.quote = c.orig.quote; V.key = ''; renderReview(); loadSrc(); }

  /* ---------- 문서 산출: 작성칸 + 미리보기 ---------- */
  var DRAFT = null, draftKey = '', draftTimer = null;
  function adoptedCards() { return CARDS.filter(function (c) { return c.sel; }); }
  function usedRoles() {
    var ad = adoptedCards();
    return ROLES.filter(function (r) { return ad.some(function (c) { return c.role === r.key; }); });
  }
  function payload() {
    return {
      notice: S.notice, lineage: S.lineage, headlines: HEAD, conclusion: CONCL, copy: COPY,
      cards: adoptedCards().map(function (c) {
        var r = c.r;
        return { id: r.id, docId: r.docId, org: r.org, category: r.category, title: r.title, year: r.year, page: c.page, pageEstimated: r.pageEstimated, quote: c.quote, role: c.role, text: c.text, matched: r.matched || [] };
      })
    };
  }

  function renderWork() {
    var used = usedRoles();
    if (!used.length) { $('ex-work').innerHTML = ''; return; }
    var html = used.map(function (r, i) {
      return '<div class="wblock"><div class="wlabel">' + MARKS[i] + '. ' + esc(r.label) + '</div>' +
        '<input class="winput' + (AIF.head[r.key] ? ' ai' : '') + '" placeholder="헤드라인 한 줄" value="' + esc(HEAD[r.key] || '') + '" oninput="HEAD[\'' + r.key + '\']=this.value;AIF.head[\'' + r.key + '\']=false;this.classList.remove(\'ai\');queueDraft()">' +
        CARDS.map(function (c, ci) {
          if (!c.sel || c.role !== r.key) return '';
          return '<div class="witem"><div class="wsrc">' + esc(c.r.org + ' 「' + c.r.title + '」 p.' + c.page) + (c.r.pageEstimated ? '<span class="tag">쪽 확인</span>' : '') + '</div>' +
            '<div class="wquote">' + cells(esc(c.quote)) + '</div>' +
            '<textarea class="logic' + (c.aiText ? ' ai' : '') + '" placeholder="문서 문장 · 줄마다 불릿 하나 · 비우면 발췌문을 그대로 싣습니다" oninput="fitArea(this);CARDS[' + ci + '].text=this.value;CARDS[' + ci + '].aiText=false;this.classList.remove(\'ai\');queueDraft()">' + esc(c.text) + '</textarea>' +
            '<div class="wwarn" id="warn-' + esc(c.r.id) + '"></div></div>';
        }).join('') + '</div>';
    }).join('');
    if (used.length >= 2) {
      html += '<div class="wblock"><div class="wlabel">수렴점 · 사업 추진의 필요성</div>' +
        '<textarea class="logic' + (AIF.concl ? ' ai' : '') + '" style="margin-bottom:0;" placeholder="위 근거들이 모이는 결론 한두 문장" oninput="CONCL=this.value;AIF.concl=false;this.classList.remove(\'ai\');queueDraft()">' + esc(CONCL) + '</textarea></div>';
    }
    $('ex-work').innerHTML = html;
    Array.prototype.forEach.call($('ex-work').querySelectorAll('textarea.logic'), fitArea);
  }
  // 불릿이 여러 줄이어도 다 보이게 높이를 내용에 맞춘다
  function fitArea(el) { el.style.height = 'auto'; el.style.height = Math.max(58, el.scrollHeight + 2) + 'px'; }
  function queueDraft() { clearTimeout(draftTimer); draftTimer = setTimeout(loadDraft, 350); }

  function loadDraft() {
    var body = S.notice ? payload() : null;
    if (!body || !body.cards.length) { renderDraft(null); return; }
    var key = JSON.stringify(body);
    if (key === draftKey && DRAFT) return;
    if (!DRAFT) { $('ex-state').style.display = ''; $('ex-state').className = 'state-msg'; $('ex-state').textContent = '문서를 구성하고 있습니다.'; }
    fetch('/api/draft', { method: 'POST', headers: { 'content-type': 'application/json' }, body: key })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) throw new Error(d.error);
        if (key !== JSON.stringify(payload())) return;   // 그사이 입력이 바뀌었으면 다음 응답을 쓴다
        DRAFT = d.draft; draftKey = key; renderDraft(DRAFT);
      })
      .catch(function (e) { DRAFT = null; $('ex-body').style.display = 'none'; $('ex-state').style.display = ''; $('ex-state').className = 'state-msg err'; $('ex-state').textContent = (e && e.message) || '문서를 구성하지 못했습니다.'; });
  }

  function renderDraft(d) {
    $('dl-btn').disabled = !d;
    $('ex-body').style.display = d ? '' : 'none';
    $('ex-state').style.display = d ? 'none' : '';
    if (!d) { $('ex-state').className = 'state-msg'; $('ex-state').textContent = '정책 근거를 먼저 선택해 주세요.'; $('ex-badges').innerHTML = ''; renderDeck(null); return; }
    var st = d.stats;
    $('ex-badges').innerHTML =
      '<span class="badge-ok" style="padding:5px 12px;border-radius:500px;font-size:11.5px;">' + ICON_OK + '원문 대조 통과 ' + st.adopted + '건</span>' +
      (st.blocked ? '<span class="badge-warn">차단 ' + st.blocked + '건</span>' : '') +
      (st.missingHeadline.length ? '<span class="badge-warn">헤드라인 미작성 ' + st.missingHeadline.length + '</span>' : '') +
      (d.factWarnings.length ? '<span class="badge-warn">숫자 확인 ' + d.factWarnings.length + '건</span>' : '');
    adoptedCards().forEach(function (c) { var el = $('warn-' + c.r.id); if (el) el.textContent = ''; });

    return '<div class="sl' + (PAL !== 'coral' ? ' ' + PAL : '') + (s.theme === 'dark' ? ' dark' : '') + '">' +
      '<div class="sl-head"><div class="sl-no">01</div><div class="sl-crumb">Ⅰ. 제안 개요<b>' + esc(s.section) + '</b></div><div class="sl-proj">' + esc(s.project) + '</div></div>' +
      '<div class="sl-hl"><div class="l1">' + ph(h1, '헤드라인 윗줄') + '</div><div class="l2">' + ph(h2, '헤드라인 아랫줄(강조)') + '</div></div>' +
      '<div class="sl-body">' + body + '</div>' + (s.foot ? '<div class="sl-foot">' + esc(s.foot) + '</div>' : '') + '<div class="sl-pg">- 4 -</div></div>';
  }

  var FMT = 'docx';
  function setFmt(f) {
    FMT = f;
    $('fmt-docx').classList.toggle('on', f === 'docx'); $('fmt-pdf').classList.toggle('on', f === 'pdf');
    $('dl-btn').textContent = f === 'pdf' ? 'PDF로 저장' : 'docx 다운로드';
  }
  // PDF는 오른쪽 미리보기(같은 문서 모델)를 A4로 인쇄한다. 브라우저 인쇄 창에서 "PDF로 저장"을 고르면 된다.
  // 서버에서 PDF를 만들려면 한글 글꼴을 싣고 쪽 배치를 새로 짜야 해서, 미리보기와 똑같이 나오는 인쇄 쪽을 쓴다
  function printPdf() {
    var paper = $('ex-paper'); if (!paper.innerHTML) return;
    var old = document.getElementById('print-frame'); if (old) old.remove();
    var f = document.createElement('iframe');
    f.id = 'print-frame'; f.setAttribute('aria-hidden', 'true');
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
    document.body.appendChild(f);
    var head = Array.prototype.map.call(document.querySelectorAll('head style, head link[rel=stylesheet]'), function (n) { return n.outerHTML; }).join('');
    var doc = f.contentDocument;
    doc.open();
    doc.write('<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>' + esc('사업이해도_' + (S.notice.no || S.notice.name || 'draft')) + '</title>' + head +
      '<style>@page{size:A4;margin:18mm 16mm}html,body{background:#fff!important;margin:0}' +
      '.paper{border:0!important;border-radius:0!important;padding:0!important;max-width:none!important;box-shadow:none!important}' +
      '.paper .arg li,.paper tr{break-inside:avoid}.paper h4{break-after:avoid}' +
      '*{-webkit-print-color-adjust:exact;print-color-adjust:exact}</style></head><body><div class="paper">' + paper.innerHTML + '</div></body></html>');
    doc.close();
    var go = function () { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) {} };
    if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(function () { setTimeout(go, 50); }); else setTimeout(go, 300);
  }
  function download() {
    if (FMT === 'pdf') { printPdf(); return; }
    var btn = $('dl-btn'); btn.disabled = true; btn.textContent = '만드는 중';
    fetch('/api/export', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload()) })
      .then(function (r) { if (!r.ok) return r.json().then(function (d) { throw new Error(d.error); }); return r.blob(); })
      .then(function (blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = '사업이해도_' + (S.notice.no || 'draft') + '.docx';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      })
      .catch(function (e) { $('ex-state').style.display = ''; $('ex-state').className = 'state-msg err'; $('ex-state').textContent = (e && e.message) || '파일을 만들지 못했습니다.'; })
      .then(function () { btn.disabled = false; btn.textContent = 'docx 다운로드'; });
  }

  /* ---------- 연결 상태 ---------- */
  var SIG = { g2b: '나라장터', inst: '공공기관 정보' };
  function setSig(id, state, reason) {
    var el = $('sig-' + id);
    el.className = 'sig' + (state ? ' ' + state : '');
    el.lastElementChild.textContent = SIG[id] + (state === 'fail' ? ' 연결 안 됨' : state === 'ok' ? '' : ' 확인 불가');
    el.title = reason || '';
  }
  function checkHealth() {
    fetch('/api/health', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
      .then(function (d) {
        ['g2b', 'inst'].forEach(function (id) { var x = d[id] || {}; setSig(id, x.ok ? 'ok' : 'fail', x.reason); });
      })
      .catch(function () { setSig('g2b', ''); setSig('inst', ''); });
  }

  renderRecent();
  renderReview();
  findMode(true);
  go('home');
  checkHealth();
</script>
<div id="ask" class="ask" hidden onclick="if(event.target===this)closeAsk()"><div class="ask-box" role="dialog" aria-modal="true" aria-labelledby="ask-t"><div id="ask-t" class="ask-t"></div><div id="ask-d" class="ask-d"></div><div id="ask-b" class="ask-b"></div></div></div>
</body>
