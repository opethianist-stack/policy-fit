<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Policy Fit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #F0F1F3;
    --surface: #FFFFFF;
    --tint: rgba(102,113,126,0.04);
    --hairline: #E9EBF0;
    --ink: #191F28;
    --body: #222222;
    --slate: #343E4B;
    --muted: #66717E;
    --violet: #7353EA;
    --violet-tint: rgba(115,83,234,0.08);
    --indigo: #524FA1;
    --blue-tint: #E6EEFF;
    --green-deep: #1B5E20;
    --green-tint: #DFEBE0;
    --soft: #E9EBF0;
    --pad: 60px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #DDE0E6; color: var(--body);
    font-family: 'Pretendard Variable','Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  .app {
    width: 1440px; height: 900px; max-width: 100%; max-height: 100%;
    background: var(--bg); display: flex; overflow: hidden;
    border: 1px solid var(--hairline); border-radius: 8px;
  }

  /* ---------- sidebar ---------- */
  .side { width: 232px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--hairline); display: flex; flex-direction: column; padding: 22px 14px 18px; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 22px; }
  .brand-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--violet); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand-name { font-weight: 600; font-size: 14.5px; letter-spacing: -0.01em; line-height: 1.2; color: var(--ink); }
  .navlist { display: flex; flex-direction: column; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 4px; margin-bottom: 2px; width: 100%; white-space: nowrap; }
  .nav span { font-size: 13px; font-weight: 500; color: var(--slate); }
  .nav svg { flex-shrink: 0; stroke: var(--slate); }
  .nav.on { background: var(--violet-tint); }
  .nav.on span { color: var(--violet); font-weight: 600; }
  .nav.on svg { stroke: var(--violet); }
  .side-div { border-top: 1px solid var(--hairline); margin: 12px 8px 14px; }
  .side-label { font-size: 10.5px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; padding: 0 10px; margin-bottom: 8px; }
  .recent { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 12px; color: var(--slate); width: 100%; border-radius: 4px; text-align: left; }
  .recent:hover { background: var(--tint); }
  /* 최근 검색 확인 창 */
  .ask { position: fixed; inset: 0; background: rgba(25,31,40,.38); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .ask[hidden] { display: none; }
  .ask-box { background: #fff; border-radius: 12px; padding: 22px 22px 18px; width: 100%; max-width: 420px; box-shadow: 0 12px 32px rgba(25,31,40,.18); display: flex; flex-direction: column; gap: 10px; }
  .ask-t { font-weight: 700; font-size: 15px; color: var(--ink); line-height: 1.45; }
  .ask-d { font-size: 12.5px; color: var(--slate); line-height: 1.6; white-space: pre-line; }
  .ask-b { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 6px; }
  .me { margin-top: auto; display: flex; align-items: center; gap: 9px; padding: 10px; border-top: 1px solid var(--hairline); }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--violet-tint); color: var(--violet); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* ---------- main ---------- */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .screen { display: none; flex: 1; overflow: hidden; flex-direction: column; min-height: 0; }
  .screen.on { display: flex; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 24px var(--pad) 44px; }

  .steps { display: flex; align-items: center; gap: 8px; padding: 22px var(--pad) 0; flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
  .steps::-webkit-scrollbar { display: none; }
  .step { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .step .n { width: 20px; height: 20px; border-radius: 50%; background: var(--soft); color: var(--muted); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .step .l { font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .step.done .n { background: var(--violet-tint); color: var(--violet); }
  .step.now .n { background: var(--violet); color: #fff; }
  .step.now .l { color: var(--ink); font-weight: 600; }
  .step.link { cursor: pointer; border-radius: 500px; padding: 2px 8px 2px 2px; margin: -2px -8px -2px -2px; }
  .step.link:hover { background: var(--violet-tint); }
  .step.link:hover .l { color: var(--violet); }
  .step.off { cursor: not-allowed; opacity: .45; }
  .cs { display: inline-block; font-size: 0; width: 1px; height: 12px; background: #C7CCD4; margin: 0 8px; vertical-align: -1px; }
  .step-line { width: 28px; height: 1px; background: var(--hairline); flex-shrink: 0; }

  h2.title { font-size: clamp(18px, 2.2vw, 22px); font-weight: 600; color: var(--ink); margin: 0 0 20px; }

  .btn { font-size: 13px; font-weight: 600; padding: 8px 16px; min-height: 40px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
  .btn.primary { background: var(--violet); color: #fff; }
  .btn.soft { background: var(--soft); color: var(--slate); }
  .btn.outline { background: #fff; border: 1px solid rgba(33,33,33,0.5); color: #212121; padding: 7px 15px; }
  .btn.mini { min-height: 32px; padding: 0 11px; font-size: 11.5px; }

  .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px; padding: 16px; }
  .badge-ok { display: inline-flex; align-items: center; gap: 4px; background: var(--green-tint); color: var(--green-deep); padding: 2px 8px; border-radius: 4px; font-size: 10.5px; font-weight: 500; }
  .sec-label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; margin-bottom: 10px; }
  .quote { font-size: 12.5px; color: var(--slate); line-height: 1.6; }
  .meta { font-size: 11.5px; color: var(--muted); }
  .doc-title { font-size: 13px; font-weight: 600; color: var(--ink); }

  /* layout blocks */
  .entry { max-width: 640px; margin-bottom: 36px; }
  .field { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--hairline); border-radius: 8px; padding: 6px 6px 6px 16px; }
  .field:focus-within { border-color: var(--violet); }
  .field input { flex: 1; min-width: 0; border: none; outline: none; font-family: inherit; font-size: 14px; font-weight: 500; color: var(--ink); background: none; padding: 8px 0; }
  .field input::placeholder { color: var(--muted); font-weight: 400; }
  .find-by { display: flex; align-items: center; gap: 2px; flex-shrink: 0; padding-right: 10px; border-right: 1px solid var(--hairline); }
  .find-by select { border: none; outline: none; background: none; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink); padding: 8px 2px; cursor: pointer; }
  .find-opts { display: none; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .find-opts.on { display: flex; }
  .find-opts select { border: 1px solid var(--hairline); border-radius: 8px; padding: 6px 8px; font-family: inherit; font-size: 12px; color: var(--ink); background: #fff; }
  .find-opts .state-msg.err, #find-state.err { color: #B42318; }
  #find-list { margin-top: 6px; }
  #find-list:empty { display: none; }
  .health { display: flex; align-items: center; gap: 16px; margin-top: 10px; padding-left: 2px; }
  .sig { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .sig i { width: 8px; height: 8px; border-radius: 50%; background: #C7CCD4; flex-shrink: 0; }
  .sig.ok i { background: #00AB53; }
  .sig.ok { color: var(--slate); }
  .sig.fail i { background: #E5484D; }
  .sig.fail { color: #B42318; }
  .rows { max-width: 820px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 150px minmax(0,1fr) 150px 76px; gap: 14px; align-items: center; width: 100%; padding: 13px 16px; text-align: left; border-top: 1px solid var(--hairline); }
  .row:first-child { border-top: none; }
  .row:hover { background: var(--tint); }
  .row .no { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .row .nm { font-size: 12.5px; color: var(--slate); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .st { font-size: 11px; font-weight: 600; color: var(--violet); text-align: right; }
  .notice { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 18px; margin-bottom: 24px; }
  .notice .k { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .notice .v { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.45; }
  .state { font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .state.wait { color: var(--violet); }
  .state.ok { color: var(--green-deep); }
  .state.no { color: var(--muted); }
  .pick { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--slate); background: #fff; border: 1px solid var(--hairline); border-radius: 500px; padding: 5px 11px; flex-shrink: 0; }
  .pick i { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid #C7CCD4; display: inline-flex; align-items: center; justify-content: center; }
  .pick.on { background: var(--violet-tint); border-color: transparent; color: var(--violet); }
  .pick.on i { background: var(--violet); border-color: var(--violet); }
  .pick.on i:after { content: ''; width: 7px; height: 4px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
  .card.sel { border-color: var(--violet); box-shadow: 0 0 0 1px var(--violet); }
  .rv-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 4px; border-top: 1px solid var(--hairline); text-align: left; }
  .rv-row .box { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid #C7CCD4; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
  .rv-row .box.on { background: var(--violet); border-color: var(--violet); }
  .rv-row .box.on:after { content: ''; width: 7px; height: 4px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px); }
  .fmt { font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 500px; background: #fff; border: 1px solid var(--hairline); color: var(--slate); }
  .fmt.on { background: var(--violet-tint); border-color: transparent; color: var(--violet); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .notice .files { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 12px; border-top: 1px solid var(--hairline); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; color: var(--slate); background: var(--soft); border-radius: 500px; padding: 5px 11px; text-decoration: none; max-width: 100%; }
  .chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  a.chip:hover { background: #DDE0E6; }
  .chip.term { background: var(--violet-tint); color: var(--violet); font-weight: 600; }
  .chip.term.rfp { background: #fff; box-shadow: inset 0 0 0 1px rgba(115,83,234,0.45); }
  .rfp-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: #fff; border: 1px solid var(--hairline); border-radius: 12px; padding: 12px 16px; margin: -8px 0 24px; font-size: 12.5px; color: var(--slate); }
  .rfp-row .k { font-size: 11px; font-weight: 600; color: var(--muted); margin-right: 2px; }
  .rfp-row .msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rfp-row .msg.err { color: #B42318; white-space: normal; }
  .msit { background: #fff; border: 1px solid var(--hairline); border-radius: 12px; padding: 14px 16px 6px; margin: -8px 0 24px; }
  .msit-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .msit-head .k { font-size: 11px; font-weight: 600; color: var(--muted); }
  .msit-row { border-top: 1px solid var(--hairline); padding: 10px 0; }
  .msit-row:first-of-type { border-top: none; }
  .msit-t { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 13px; }
  .msit-t a { color: var(--ink); font-weight: 600; text-decoration: none; }
  .msit-t a:hover { text-decoration: underline; }
  .src-badge { font-size: 10.5px; font-weight: 700; color: var(--indigo); background: var(--blue-tint); border-radius: 4px; padding: 1px 6px; flex-shrink: 0; }
  .msit-f { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .msit-loose { margin: 4px 0 10px; }
  .msit-loose summary { cursor: pointer; font-size: 12px; color: var(--muted); padding: 6px 0; }
  .msit-loose .msit-row { opacity: .85; }
  .msit-f .chip { padding: 4px 10px; font-size: 11px; }
  .linkish { font-size: 12.5px; font-weight: 600; color: var(--violet); padding: 4px 2px; margin-top: 14px; }
  .manual { max-width: 640px; background: #fff; border: 1px solid var(--hairline); border-radius: 12px; padding: 18px; margin: 0 0 32px; display: none; }
  .manual.on { display: block; }
  .spec-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .spec-row input[type=text] { flex: 1 1 220px; }
  .spec-row select { border: 1px solid var(--hairline); border-radius: 8px; padding: 9px 10px; font-family: inherit; font-size: 13px; color: var(--ink); background: #fff; }
  .spec-item { border-top: 1px solid var(--hairline); padding: 11px 0; }
  .spec-item:first-child { border-top: 0; }
  .spec-item .nm { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.45; margin-bottom: 3px; }
  .spec-item .meta { display: block; margin-bottom: 7px; }
  .spec-item .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .manual label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin: 12px 0 5px; }
  .manual input[type=text] { width: 100%; border: 1px solid var(--hairline); border-radius: 8px; padding: 9px 10px; font-family: inherit; font-size: 13px; color: var(--ink); outline: none; }
  .manual input[type=text]:focus { border-color: var(--violet); }
  .chip.term button { color: var(--violet); font-size: 13px; line-height: 1; padding: 0; opacity: 0.7; }
  .terms { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .terms input { border: 1px dashed #C7CCD4; border-radius: 500px; padding: 5px 11px; font-family: inherit; font-size: 11.5px; width: 110px; outline: none; background: #fff; }
  .terms input:focus { border-color: var(--violet); border-style: solid; }
  .scope { margin-left: auto; display: inline-flex; background: var(--soft); border-radius: 8px; padding: 2px; }
  .scope button { font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 5px 10px; border-radius: 6px; }
  .scope button.on { background: #fff; color: var(--ink); }
  .node { font-size: 12.5px; font-weight: 600; padding: 9px 12px; border-radius: 8px; background: var(--bg); color: var(--slate); }
  .node.first { background: var(--violet-tint); color: var(--violet); }
  .node small { display: block; font-size: 10.5px; font-weight: 500; opacity: 0.75; margin-top: 2px; }
  .node .cov { display: block; font-size: 10.5px; font-weight: 500; margin-top: 4px; color: var(--muted); }
  .node .cov.none { color: #B54708; }
  .cov-warn { font-size: 11.5px; line-height: 1.55; color: #B54708; background: #FFFAEB; border-radius: 8px; padding: 8px 10px; }
  .card .ai-rank { font-size: 11.5px; color: var(--violet); margin: -4px 0 10px; display: flex; gap: 6px; align-items: baseline; }
  .card .ai-rank b { font-weight: 700; letter-spacing: 1px; }
  .state-msg { font-size: 13px; color: var(--muted); padding: 28px 4px; }
  .state-msg.err { color: #B42318; }
  .hl { background: rgba(115,83,234,0.14); border-radius: 2px; }
  .logic { width: 100%; min-height: 58px; resize: vertical; border: 1px solid var(--hairline); border-radius: 8px; padding: 9px 10px; font-family: inherit; font-size: 12.5px; line-height: 1.5; color: var(--ink); outline: none; margin-bottom: 14px; background: #fff; }
  .logic:focus { border-color: var(--violet); }
  .paper { background: #fff; border: 1px solid var(--hairline); border-radius: 4px; max-width: 760px; padding: 48px 56px; color: var(--ink); }
  .paper h3 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .paper .sub { font-size: 14px; color: var(--muted); margin-bottom: 26px; }
  .paper h4 { font-size: 16px; font-weight: 700; margin: 24px 0 10px; }
  .paper table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .paper td, .paper th { border: 1px solid #D5D9E0; padding: 7px 10px; text-align: left; vertical-align: top; line-height: 1.5; }
  .paper th, .paper td.h { background: #F3F4F6; font-weight: 600; white-space: nowrap; }
  .paper .flow { font-size: 13px; } .paper .flow small { color: var(--muted); font-size: 11.5px; }
  .paper .note { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .badge-warn { display: inline-flex; align-items: center; background: #FFF4E5; color: #9A5B00; padding: 5px 12px; border-radius: 500px; font-size: 11.5px; font-weight: 500; }
  .deck-card { position: relative; }
  .deck-card.rec { border-color: var(--violet); box-shadow: 0 0 0 1px var(--violet); }
  .rec-tag { position: absolute; top: 18px; right: 18px; background: var(--violet); color: #fff; font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 500px; }
  @media (max-width: 860px) { .paper { padding: 24px 18px; } }
  .search-body { display: flex; gap: 24px; }
  .search-body .lineage { width: 280px; flex-shrink: 0; }
  .search-body .results { flex: 1; min-width: 0; }
  .result-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-bottom: 22px; }
  .chat-wrap { flex: 1; display: flex; overflow: hidden; min-height: 0; }
  .src-col { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .src-head { padding: 20px 40px 14px; border-bottom: 1px solid var(--hairline); display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .src-nav { display: flex; align-items: center; gap: 8px; }
  .src-body { flex: 1; overflow-y: auto; padding: 20px 40px; min-height: 0; background: #fff; font-size: 13px; line-height: 1.75; color: var(--slate); white-space: pre-wrap; word-break: break-all; }
  .src-body mark { background: rgba(115,83,234,0.16); color: var(--ink); border-radius: 2px; padding: 1px 0; }
  .src-foot { padding: 12px 40px 20px; border-top: 1px solid var(--hairline); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .src-foot .meta { margin-right: auto; }
  .tag { display: inline-block; font-size: 10.5px; font-weight: 600; color: #9A5B00; background: #FFF4E5; border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
  .roles { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .roles button { font-size: 11.5px; font-weight: 600; padding: 6px 11px; border-radius: 500px; background: #fff; border: 1px solid var(--hairline); color: var(--slate); }
  .roles button.on { background: var(--violet-tint); border-color: transparent; color: var(--violet); }
  .ex-body { display: flex; gap: 24px; align-items: flex-start; }
  .work { width: 400px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
  .wblock { background: #fff; border: 1px solid var(--hairline); border-radius: 12px; padding: 16px; }
  .wlabel { font-size: 12.5px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  .winput { width: 100%; border: 1px solid var(--hairline); border-radius: 8px; padding: 9px 10px; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink); outline: none; margin-bottom: 12px; }
  .winput:focus { border-color: var(--violet); }
  .witem { border-top: 1px solid var(--hairline); padding-top: 10px; margin-top: 2px; }
  .wsrc { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .wquote { font-size: 12px; color: var(--muted); line-height: 1.55; background: var(--bg); border-radius: 6px; padding: 7px 9px; margin-bottom: 6px; max-height: 92px; overflow-y: auto; }
  .witem .logic { margin-bottom: 6px; }
  .wwarn { font-size: 11.5px; color: #9A5B00; margin-bottom: 6px; }
  .wwarn:empty { display: none; }
  .ex-body .paper { flex: 1; min-width: 0; position: sticky; top: 0; }

  /* 제안서 장표 목업 — 부서 정성제안서 판형(가로 1.4:1). 크기는 장표 너비(cqw) 기준 */

        aspect-ratio: 1.4 / 1; background: #fff; border: 1px solid #D5D9E0; box-shadow: 0 1px 3px rgba(25,31,40,0.06); position: relative;
        padding: 1.4cqw 2.6cqw 2.4cqw; display: flex; flex-direction: column; overflow: hidden; color: var(--txt); font-size: 1.25cqw; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }

  .ap-h { display: flex; align-items: center; gap: 1cqw; border-bottom: 1px solid #404040; padding-bottom: .6cqw; }
  .ap-h .pill { background: #404040; color: #fff; border-radius: 500px; padding: .4cqw 1.4cqw; font-weight: 700; font-size: 1.05cqw; flex-shrink: 0; }
  .ap-h b { font-size: 1.2cqw; }
  .ap-sec .pw { border: 1px solid #D9D9D9; padding: .5cqw .7cqw; font-size: .85cqw; margin: 0 1.5cqw; }
  .ap-cite { font-weight: 700; font-size: 1.05cqw; }
  .ap-sub { font-size: 1cqw; color: #404040; }
  .ap-div { border-top: .15cqw dashed #A6A6A6; }
  .ap-r { border-radius: 2cqw; background: #fff; box-shadow: 0 0 1.4cqw rgba(0,0,0,.14); display: flex; flex-direction: column; overflow: hidden; border: .2cqw solid var(--p2); }
  .ap-head { background: var(--p); color: #fff; font-weight: 700; font-size: 2cqw; padding: 1cqw 2cqw; }
  .ap-in { flex: 1; padding: 1.4cqw 2cqw; display: flex; flex-direction: column; gap: 1.2cqw; }
  .ap-lead { text-align: center; font-weight: 700; font-size: 1.3cqw; }
  .ap-slogan { border: .18cqw solid var(--p); border-radius: 1cqw; padding: 1.2cqw; text-align: center; display: flex; flex-direction: column; gap: .4cqw; font-size: 1.15cqw; }
  .ap-slogan b { font-size: 1.9cqw; color: var(--p); }
  .ap-slogan b.ph { color: #A8AFB9; }
  .ap-keys { display: grid; grid-template-columns: 1fr 3cqw 1fr 3cqw 1fr; align-items: center; text-align: center; }
  .ap-cir { width: 11cqw; height: 11cqw; border-radius: 50%; margin: 0 auto; background: var(--tile); border: .15cqw solid var(--p2); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ap-cir.on { background: var(--p); border-color: var(--p); }
  .ap-cir small { font-size: .85cqw; color: var(--p2); font-weight: 700; }
  .ap-cir b { font-size: 1.5cqw; color: var(--p); }
  .ap-cir.on small, .ap-cir.on b { color: #fff; }
  .ap-cir .ph { color: #A8AFB9; }
  .ap-cir.on .ph { color: rgba(255,255,255,.7); }
  .ap-dash { border-top: .18cqw dashed var(--p2); position: relative; }
  .ap-dash:after { content: ''; position: absolute; right: -.2cqw; top: -.65cqw; border-left: .9cqw solid var(--p); border-top: .55cqw solid transparent; border-bottom: .55cqw solid transparent; }
  .ap-cap { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; font-size: 1cqw; }
  .ap-cap > div + div { border-left: 1px solid #D9D9D9; }
  .ap-units { background: var(--p); padding: 1.1cqw 2cqw 1.3cqw; color: #fff; }
  .ap-units .t { font-weight: 700; font-size: 1.25cqw; margin-bottom: .8cqw; }
  .ap-units .ps { display: grid; grid-template-columns: repeat(5, 1fr); gap: .8cqw; }
  .ap-units .ps span { background: rgba(255,255,255,.85); color: #7F7F7F; border-radius: 500px; text-align: center; padding: .6cqw .2cqw; font-size: 1cqw; }
  /* 로드맵·근거문서형 */
  .dl { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 1.4cqw; }
  .dl-t { text-align: center; font-weight: 700; font-size: 1.5cqw; color: var(--dk); margin-bottom: 1.2cqw; }
  .dl-line { position: relative; display: grid; gap: 2cqw; }
  .dl-line:before { content: ''; position: absolute; left: -2.6cqw; right: -2.6cqw; top: .8cqw; height: .25cqw; background: linear-gradient(90deg, #E7E6E6, var(--p2) 30%, var(--p)); }
  .dl-doc { position: relative; display: flex; flex-direction: column; align-items: center; gap: .6cqw; text-align: center; padding-top: 2.8cqw; }
  .dl-dot { position: absolute; top: 0; width: 1.8cqw; height: 1.8cqw; border-radius: 50%; background: #fff; border: .3cqw solid var(--p2); }
  .dl-doc:last-child .dl-dot { background: var(--p); border-color: var(--p); }
  .dl-yr { position: absolute; top: .05cqw; left: calc(50% + 1.4cqw); font-size: 1cqw; font-weight: 700; color: var(--dk); }
  .dl-cover { width: 13cqw; height: 17cqw; background: #fff; border: 1px solid #D9D9D9; box-shadow: 0 .25cqw .6cqw rgba(0,0,0,.15); display: flex; flex-direction: column; color: #262626; }
  .dl-cover .band { height: 1.2cqw; background: var(--p); }
  .dl-cover .t { flex: 1; display: flex; align-items: center; justify-content: center; padding: .8cqw; font-weight: 700; font-size: 1.3cqw; line-height: 1.3; }
  .dl-cover .o { font-size: .8cqw; color: #7F7F7F; padding-bottom: .6cqw; }
  .dl-role { font-size: 1.05cqw; color: var(--p); font-weight: 700; }
  .dl-pt { font-size: 1.2cqw; color: #404040; line-height: 1.5; }
  .dl-bot { display: grid; grid-template-columns: 1fr 4cqw 1fr; gap: 1.2cqw; align-items: center; margin-top: auto; }
  .dl-chk { display: flex; flex-direction: column; gap: .8cqw; }
  .dl-chk .it { display: flex; gap: .8cqw; align-items: flex-start; font-size: 1.3cqw; }
  .dl-chk .bx { color: var(--p); border: .2cqw solid var(--p); width: 1.8cqw; height: 1.8cqw; display: inline-flex; align-items: center; justify-content: center; font-size: 1.2cqw; flex-shrink: 0; }
  .dl-chk b { display: block; font-size: 1cqw; color: #7F7F7F; }
  .dl-chk span { color: #262626; }
  .dl-arrow { height: 7cqw; background: linear-gradient(90deg, #F2F2F2, var(--p2)); clip-path: polygon(0 25%, 55% 25%, 55% 0, 100% 50%, 55% 100%, 55% 75%, 0 75%); }
  .dl-need { border: .25cqw solid var(--p); background: var(--tile); padding: 1.2cqw 1.4cqw; font-weight: 700; font-size: 1.45cqw; color: var(--tileT); text-align: center; }
  .dl-need small { display: block; font-size: 1cqw; color: var(--p); margin-bottom: .4cqw; }
  /* 수치 강조형 */
  .nm-stats { display: grid; gap: 1.4cqw; }
  .nm-stat { border: .22cqw solid #7F7F7F; display: flex; flex-direction: column; }
  .nm-stat .n { font-size: 4cqw; font-weight: 700; color: var(--p); text-align: center; padding: .8cqw 0 .2cqw; letter-spacing: -.02em; }
  .nm-stat .t { font-size: 1.15cqw; text-align: center; padding: 0 1cqw .6cqw; }
  .nm-stat .sl-src { background: var(--gy); text-align: center; padding: .4cqw; }
  .nm-tab { width: 100%; border-collapse: collapse; font-size: 1.1cqw; }
  .nm-tab td { border: 1px solid #BFBFBF; padding: .6cqw .8cqw; vertical-align: middle; }
  .nm-tab td:first-child { background: var(--gy); font-weight: 700; text-align: center; white-space: nowrap; width: 11cqw; }

  /* 정책-연결형 */
  .lk-cols { display: grid; gap: 1.4cqw; flex: 1; min-height: 0; }
  .lk-card { border: 1px solid #D6DEEA; border-radius: .5cqw; display: flex; flex-direction: column; box-shadow: 0 .15cqw .4cqw rgba(0,0,0,.07); overflow: hidden; }
  .lk-top { padding: 1.1cqw 1.3cqw .8cqw; display: flex; flex-direction: column; gap: .6cqw; flex: 1; }
  .lk-h { display: flex; align-items: center; gap: .9cqw; font-weight: 700; font-size: 1.4cqw; color: var(--dk); line-height: 1.3; }
  .lk-ic { width: 3cqw; height: 3cqw; border-radius: 50%; background: var(--dk); color: #fff; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.2cqw; }
  .lk-lab { font-size: .95cqw; color: var(--p); font-weight: 700; }
  .lk-b { font-size: 1.3cqw; line-height: 1.5; color: #404040; }
  .lk-con { background: var(--gy); padding: .9cqw 1.3cqw; font-size: 1.05cqw; min-height: 5cqw; }
  .lk-con .k { display: block; font-weight: 700; color: var(--hd); font-size: 1.05cqw; margin-bottom: .3cqw; }
  .lk-box { border: 1px solid #D6DEEA; border-radius: .5cqw; padding: .8cqw 1.3cqw; }
  .lk-box .k { font-weight: 700; font-size: 1.1cqw; color: var(--dk); margin-bottom: .5cqw; }
  .lk-kw { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1cqw; text-align: center; font-size: 1.05cqw; }
  .lk-kw b { display: block; color: var(--p); font-size: 1.3cqw; }
  .lk-need { display: flex; align-items: center; gap: 1.4cqw; border: 1px solid #D6DEEA; border-radius: .5cqw; padding: .8cqw 1.3cqw; font-size: 1.3cqw; font-weight: 700; }
  .lk-need .k { font-size: 1.1cqw; color: var(--dk); flex-shrink: 0; }
  .lk-need .p { background: var(--tile); color: var(--tileT); border-radius: 500px; padding: .4cqw 1.4cqw; flex: 1; text-align: center; }
  /* 발주기관 계획형 */
  .pl { display: grid; grid-template-columns: 1.55fr 1fr; gap: 2cqw; flex: 1; min-height: 0; }
  .pl-l, .pl-r { display: flex; flex-direction: column; gap: 1.2cqw; min-height: 0; }
  .pl-title { text-align: center; }
  .pl-title .t { font-size: 1.7cqw; font-weight: 500; color: #404040; }
  .pl-title .v { font-size: 1.9cqw; font-weight: 700; color: var(--p); }
  .pl-k { font-weight: 700; font-size: 1.25cqw; display: flex; align-items: center; gap: .5cqw; }
  .pl-k:before { content: '✔'; color: var(--p); font-size: 1.4cqw; }
  .pl-tasks { display: grid; gap: 1cqw; }
  .pl-task { background: var(--p); color: #fff; border-radius: 1.2cqw; padding: 1.2cqw; text-align: center; font-size: 1.3cqw; line-height: 1.3; min-height: 5.4cqw; display: flex; align-items: center; justify-content: center; }
  .pl-pts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .9cqw; font-size: 1.25cqw; line-height: 1.45; }
  .pl-pts li { padding-left: 1.1cqw; text-indent: -1.1cqw; }
  .pl-pts li:before { content: '• '; color: var(--p); }
  .pl-up { border: 1px solid #BFBFBF; border-radius: .6cqw; padding: 1cqw 1.2cqw; font-size: 1.2cqw; line-height: 1.45; display: flex; flex-direction: column; gap: .3cqw; }
  .pl-up small { color: var(--p); font-weight: 700; font-size: .95cqw; }
  .pl-bottom { background: var(--tile); color: var(--tileT); font-weight: 700; text-align: center; padding: .8cqw 1.2cqw; font-size: 1.35cqw; border-radius: 500px; }
  /* 측면 원형형 */
  .pi { position: relative; flex: 1; min-height: 0; display: grid; gap: 2cqw; grid-template-rows: auto 1fr; }
  .pi-band { position: absolute; left: -2.6cqw; right: -2.6cqw; top: 6.5cqw; height: 6cqw; background: #D9D9D9; }
  .pi-c { position: relative; justify-self: center; width: 15cqw; height: 15cqw; border-radius: 50%; background: var(--p); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1.6cqw; box-sizing: border-box; }
  .pi-c small { font-size: 1cqw; opacity: .85; margin-bottom: .4cqw; }
  .pi-c b { font-size: 1.45cqw; line-height: 1.3; font-weight: 500; }
  .pi-c .ph { color: rgba(255,255,255,.6); }
  .pi-col { display: flex; flex-direction: column; gap: 1cqw; min-height: 0; }
  .pi-doc { background: var(--gy); color: var(--tileT); font-weight: 700; padding: .3cqw .7cqw; align-self: flex-start; font-size: 1.2cqw; }
  .pi-col .sl-ul { font-size: 1.2cqw; line-height: 1.45; gap: .7cqw; }
  .pi-col .sl-ul li:before { content: '• '; }
  /* 정책 인용형 */
  .sp { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 3cqw; padding: 0 4cqw; }
  .sp-q { display: flex; flex-direction: column; gap: .8cqw; }
  .sp-q:nth-child(2) { align-items: flex-end; text-align: right; }
  .sp-q .q { font-size: 2.3cqw; line-height: 1.45; font-weight: 500; color: #fff; max-width: 70cqw; }
  .sp-q .q .hl { background: none; color: var(--p2); }
  .sp-q .s { font-size: 1.2cqw; color: #D9D9D9; }
  .sp-q .src { font-size: .95cqw; color: #8C8C8C; }
  .sp-bottom { text-align: center; font-size: 2.2cqw; font-weight: 700; color: var(--p); }
  .sl.navy .sp-bottom, .sl.navy .sp-q .q .hl { color: #F4B183; }

  .wire { background: var(--bg); border-radius: 8px; padding: 12px; height: 180px; display: flex; flex-direction: column; gap: 8px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ---------- tablet ---------- */
  @media (max-width: 1500px) {
    body { padding: 0; align-items: stretch; }
    .app { width: 100%; height: 100%; border: none; border-radius: 0; }
  }
  @media (max-width: 1180px) {
    :root { --pad: 32px; }
    .src-head, .src-body, .src-foot { padding-left: 24px; padding-right: 24px; }
    .ex-body { flex-direction: column; }
    .work { width: 100%; }
    .ex-body .paper { position: static; width: 100%; }
    .review { width: 320px; }
    .pages { grid-template-columns: repeat(2, minmax(0,1fr)); }
  }

  /* ---------- mobile ---------- */
  @media (max-width: 860px) {
    :root { --pad: 18px; }
    .app { flex-direction: column; }
    .side {
      width: 100%; flex-direction: row; align-items: center; gap: 4px;
      border-right: none; border-bottom: 1px solid var(--hairline);
      padding: 10px 12px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
    }
    .side::-webkit-scrollbar { display: none; }
    .brand { padding: 0 10px 0 0; margin-right: 4px; border-right: 1px solid var(--hairline); flex-shrink: 0; }
    .navlist { flex-direction: row; gap: 2px; }
    .nav { margin-bottom: 0; padding: 8px 12px; }
    .side-div, .side-label, .recent, .me { display: none; }

    .row { grid-template-columns: minmax(0,1fr) 64px; row-gap: 3px; }
    .row .nm, .row .ag { grid-column: 1; }
    .row .st { grid-column: 2; grid-row: 1; }
    .notice { grid-template-columns: repeat(2, minmax(0,1fr)); }

    .search-body { flex-direction: column; gap: 18px; }
    .search-body .lineage { width: 100%; }
    .result-grid { grid-template-columns: 1fr; }

    .chat-wrap { flex-direction: column; overflow-y: auto; }
    .src-col { min-height: 460px; }
    .review { width: 100%; border-left: none; border-top: 1px solid var(--hairline); overflow: visible; }

    .pages { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .actions .btn { flex: 1 1 auto; }
    .actions .btn.outline { margin-left: 0 !important; width: 100%; }
  }
  @media (max-width: 480px) {
    .brand > :not(.brand-mark) { display: none; }   /* 좁은 폭: 로고 글자를 숨겨 메뉴 세 개가 한 줄에 들어가게 */
    .brand { padding-right: 8px; }
    .nav { padding: 8px 9px; gap: 6px; }
    .pages { grid-template-columns: 1fr; }
    .page-card { height: auto; min-height: 110px; }
    .field { flex-wrap: wrap; padding-left: 12px; }
    .find-by { width: 100%; border-right: 0; border-bottom: 1px solid var(--hairline); padding: 0 0 4px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <div class="side">
    <div class="brand">
      <div class="brand-mark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </div>
      <div class="brand-name">Policy Fit</div>
    </div>

    <div class="navlist">
      <button class="nav" id="nav-home" onclick="go('home')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
        <span>홈</span>
      </button>
      <button class="nav" id="nav-search" onclick="go('search')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span>정책 근거 검색</span>
      </button>
      <button class="nav" id="nav-chat" onclick="go('chat')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 12l3 3 5-6"/></svg>
        <span>정책 근거 선택</span>
      </button>
    </div>

    <div class="side-div"></div>
    <div class="side-label" id="side-recent-label">최근 검색</div>
    <div id="side-recent"></div>

    <div class="me">
      <div class="avatar">송</div>
      <div style="font-size:12px;color:var(--slate);font-weight:500;">AI미래교육본부</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- HOME -->
    <div class="screen" id="s-home">
      <div class="scroll" style="padding-top:44px;">
        <h2 class="title">공고 찾기</h2>
        <div class="entry">
          <form class="field" onsubmit="submitFind(event)">
            <div class="find-by">
              <select id="f-target" aria-label="검색 대상" onchange="findMode(true)"><option value="bid">입찰공고</option><option value="spec">사전규격</option></select>
              <select id="f-mode" aria-label="검색 방법" onchange="findMode(true)"><option value="no">공고번호</option><option value="kw">키워드</option></select>
            </div>
            <input id="no-input" type="text" inputmode="text" autocomplete="off" placeholder="예: R26BK00412587" aria-label="입찰공고번호">
            <button class="btn primary" type="submit">조회</button>
          </form>
          <div class="find-opts" id="find-opts">
            <select id="f-days" aria-label="조회 기간"></select>
            <span class="meta" id="find-state"></span>
          </div>
          <div id="find-list"></div>
          <div class="health" aria-live="polite">
            <span class="sig" id="sig-g2b"><i></i><span>나라장터</span></span>
            <span class="sig" id="sig-inst"><i></i><span>공공기관 정보</span></span>
          </div>
          <button class="linkish" onclick="toggleManual()">공고번호 없이 제안요청서로 시작</button>
        </div>

        <div class="manual" id="manual">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <button class="btn soft mini" onclick="$('mn-file').click()">제안요청서 파일 선택</button>
            <span class="meta" id="mn-state">pdf · hwp · hwpx · docx, 4MB 이하</span>
            <input type="file" id="mn-file" accept=".pdf,.hwp,.hwpx,.docx" style="display:none;" onchange="manualFile(this.files[0])">
          </div>
          <label for="mn-name">사업명</label>
          <input type="text" id="mn-name" autocomplete="off">
          <label for="mn-org">발주기관</label>
          <input type="text" id="mn-org" autocomplete="off" placeholder="예: 한국교육학술정보원">
          <button class="btn primary" id="mn-go" style="margin-top:16px;" onclick="startManual()" disabled>정책 근거 검색</button>
        </div>

        <div id="home-recent"></div>
      </div>
    </div>

    <!-- SEARCH -->
    <div class="screen" id="s-search">
      <div class="steps">
        <div class="step now"><div class="n">1</div><div class="l">정책 근거</div></div>
        <div class="step-line"></div>
        <div class="step"><div class="n">2</div><div class="l">선택</div></div>
        <div class="step-line"></div>
        <div class="step"><div class="n">3</div><div class="l">산출</div></div>
        <div class="step-line"></div>
        <div class="step"><div class="n">4</div><div class="l">구도 추천</div></div>
      </div>
      <div class="scroll">
        <h2 class="title">정책 근거 검색</h2>

        <div style="display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--hairline);border-radius:8px;padding:13px 16px;margin-bottom:16px;max-width:520px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#66717E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>

        <div class="src-col">

              <span class="meta" id="src-page" style="min-width:44px;text-align:center;"></span>
              <button class="btn soft mini" id="src-next" onclick="srcMove('next')" disabled>다음 쪽</button>

          <div class="src-foot">
            <span class="meta" id="src-hint"></span>
            <button class="btn soft mini" id="src-reset" onclick="resetQuote()" style="display:none;">처음 발췌로</button>

          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;"><button class="ai-btn" id="ai-roles-btn" onclick="aiRoles()">AI 역할 분류</button><span class="ai-msg" id="ai-roles-msg"></span></div>
          <div id="rv-list" style="margin-bottom:18px;"></div>

        <div class="step-line"></div>
        <div class="step now"><div class="n">3</div><div class="l">산출</div></div>

        <div class="step done"><div class="n">2</div><div class="l">선택</div></div>
        <div class="step-line"></div>

      <div class="scroll">

        <div class="deck-ctl" id="deck-ctl">

            <input id="deck-h2" placeholder="헤드라인 아랫줄(강조)" oninput="DECKHL[1]=this.value;DECKHL.edited=true;paintDeck()">
          </div>

            <button class="ai-btn" id="ai-deck-btn" onclick="aiDeck()">AI 문구 다듬기</button><span class="ai-msg" id="ai-deck-msg"></span>
            <div class="pal"><span class="k">색</span><button id="pal-coral" class="on" style="background:#FF5647" onclick="setPal('coral')" aria-label="코랄"></button><button id="pal-orange" style="background:#ED7D31" onclick="setPal('orange')" aria-label="주황"></button><button id="pal-navy" style="background:#2E5597" onclick="setPal('navy')" aria-label="네이비"></button><button id="pal-purple" style="background:#733E98" onclick="setPal('purple')" aria-label="보라"></button><button id="pal-blue" style="background:#0E70F2" onclick="setPal('blue')" aria-label="파랑"></button><button id="pal-pink" style="background:#FE2D81" onclick="setPal('pink')" aria-label="분홍"></button></div>
          </div>
        </div>
        <div class="decks" id="deck-grid"></div>
      </div>

  </div>
</div>

<script>
  var NAV = { home: 'nav-home', search: 'nav-search', chat: 'nav-chat', export: 'nav-chat', deck: 'nav-chat' };
  function go(name) {
    ['home','search','chat','export','deck'].forEach(function (s) {
      document.getElementById('s-' + s).classList.toggle('on', s === name);
    });
    ['nav-home','nav-search','nav-chat'].forEach(function (id) {
      document.getElementById(id).classList.remove('on');
    });
    document.getElementById(NAV[name]).classList.add('on');
    if (name === 'chat') loadSrc();
    if (name === 'export') renderWork();
    if (name === 'export' || name === 'deck') loadDraft();
    paintSteps(name);
    CURSTEP = name; saveWork();
  }
  // 단계 표시(1 정책 근거 · 2 선택 · 3 산출 · 4 구도 추천)를 눌러 오갈 수 있게 한다. 앞 단계 재료가 없으면 흐리게 두고 막는다
  var STEP_KEYS = ['search', 'chat', 'export', 'deck'];
  function stepOk(k) {
    if (k === 'search') return !!(S && S.notice);
    if (k === 'chat') return CARDS.length > 0;
    return CARDS.some(function (c) { return c.sel; });
  }
  function stepWhy(k) { return k === 'search' ? '홈에서 공고를 먼저 찾아 주세요' : k === 'chat' ? '정책 근거 검색을 먼저 진행해 주세요' : '정책 근거를 1건 이상 선택해 주세요'; }
  function repaintSteps() { var on = STEP_KEYS.filter(function (k) { return $('s-' + k).classList.contains('on'); })[0]; if (on) paintSteps(on); }
  function paintSteps(name) {
    var at = STEP_KEYS.indexOf(name);
    Array.prototype.forEach.call(document.querySelectorAll('.steps'), function (box) {
      Array.prototype.forEach.call(box.querySelectorAll('.step'), function (el, i) {
        var k = STEP_KEYS[i], ok = stepOk(k), here = at === i;
        el.className = 'step' + (here ? ' now' : at > i ? ' done' : '') + (here ? '' : ok ? ' link' : ' off');
        el.title = here || ok ? '' : stepWhy(k);
        el.onclick = here || !ok ? null : function () { if (k === 'chat') startReview(); else go(k); };
      });
    });
  }
  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function api(path, params) {
    var q = Object.keys(params).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
    return fetch(path + '?' + q, { cache: 'no-store' }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: '응답을 읽지 못했습니다.' }; });
    });
  }

  var ICON_SEARCH = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#66717E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
  var ICON_OPEN = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#343E4B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>';
  var ICON_FILE = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#343E4B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 21h16"/></svg>';
  var ICON_DOC = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7353EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
  var ICON_OK = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#1B5E20" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

  /* ---------- 최근 검색 (이 브라우저에만 저장) ---------- */
  function loadRecent() { try { return JSON.parse(localStorage.getItem('pf-recent') || '[]'); } catch (e) { return []; } }
  function saveRecent(n) {
    var list = loadRecent().filter(function (x) { return x.no !== n.no; });
    list.unshift({ no: n.no, name: n.name, org: n.demandOrg });
    list = list.slice(0, 8);
    try { localStorage.setItem('pf-recent', JSON.stringify(list)); } catch (e) {}
    pruneWork(list);
    renderRecent();
  }

  /* ---------- 작업 저장 (이 브라우저에만) ----------
     공고마다 검색 결과·선택·역할·작성칸·장표 설정을 localStorage 'pf-work:<공고번호>'에 둔다. 최근 검색 8건과 같이 간다.
     4초마다 바뀐 게 있으면 저장하고, 다른 공고로 넘어가기 전·화면을 옮길 때·창을 닫을 때도 저장한다 */
  var WORK = 'pf-work:', CURSTEP = 'home', lastWork = '';
  var STEP_NAME = { search: '정책 근거', chat: '선택', export: '산출', deck: '구도 추천' };
  function loadWork(no) { try { return JSON.parse(localStorage.getItem(WORK + no) || 'null'); } catch (e) { return null; } }
  function workInfo(no) {
    var w = loadWork(no); if (!w) return null;
    var n = (w.CARDS || []).filter(function (c) { return c.sel; }).length;
    var d = new Date(w.at), t = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    return { w: w, sel: n, label: (STEP_NAME[w.step] || '정책 근거') + ' 단계 · 선택 ' + n + '건 · ' + t };
  }
  function snapshot() {
    if (!S.no || !S.notice) return null;   // 입찰공고만 저장한다(최근 검색에 공고번호로 남는 것)
    var rfp = S.rfp || { state: 'none' };
    if (rfp.text && rfp.text.length > 20000) rfp = Object.assign({}, rfp, { text: rfp.text.slice(0, 20000) });
    return { v: 1, no: S.no, step: CURSTEP === 'home' ? 'search' : CURSTEP, S: Object.assign({}, S, { rfp: rfp }), CARDS: CARDS, cur: cur, HEAD: HEAD, CONCL: CONCL,
      AIF: AIF, COPY: COPY, DECKHL: [DECKHL[0], DECKHL[1]], hlEdited: !!DECKHL.edited, DECKSEL: DECKSEL, PAL: PAL, MSIT: MSIT, sug: AI.sug };
  }
  function saveWork() {
    var w = snapshot(); if (!w) return;
    var body = JSON.stringify(Object.assign({}, w, { at: 0 }));
    if (body === lastWork) return;
    w.at = Date.now();
    var txt = JSON.stringify(w);
    try { localStorage.setItem(WORK + w.no, txt); }
    catch (e) {   // 저장 공간이 차면 최근 검색에서 가장 오래된 작업부터 지우고 한 번 더
      var old = loadRecent().filter(function (x) { return x.no !== w.no; }).reverse();
      for (var i = 0; i < old.length; i++) { try { localStorage.removeItem(WORK + old[i].no); localStorage.setItem(WORK + w.no, txt); break; } catch (e2) {} }
    }
    lastWork = body;
  }
  function pruneWork(list) {
    try {
      var keep = {}; list.forEach(function (x) { keep[WORK + x.no] = 1; });
      for (var i = localStorage.length - 1; i >= 0; i--) { var k = localStorage.key(i); if (k && k.indexOf(WORK) === 0 && !keep[k]) localStorage.removeItem(k); }
    } catch (e) {}
  }
  setInterval(saveWork, 4000);
  window.addEventListener('pagehide', saveWork);
  document.addEventListener('visibilitychange', function () { if (document.hidden) saveWork(); });

  // 최근 검색을 누르면 바로 조회하지 않고 한 번 묻는다. 저장된 작업이 있으면 이어서 할지 처음부터 할지 고른다
  function pickRecent(no) {
    no = String(no).toUpperCase();
    if (S.no === no && S.notice) { go(CURSTEP === 'home' ? 'search' : CURSTEP); return; }   // 지금 열려 있는 공고는 묻지 않는다
    var r = loadRecent().filter(function (x) { return x.no === no; })[0] || {};
    var info = workInfo(no);
    var desc = no + (r.name ? '\n' + r.name : '') + (info ? '\n\n저장된 작업: ' + info.label : '');
    if (S.no && S.notice) desc += '\n지금 작업 중인 공고(' + S.no + ')는 저장해 두었다가 다시 이어서 할 수 있습니다.';
    showAsk('해당 공고를 기반으로 다시 작업을 시작하시겠습니까?', desc, info ? [
      { label: '아니오' },
      { label: '처음부터 다시', fn: function () { openNotice(no); } },
      { label: '저장된 작업 이어서', primary: true, fn: function () { resumeWork(no); } }
    ] : [
      { label: '아니오' },
      { label: '예', primary: true, fn: function () { openNotice(no); } }
    ]);
  }
  // 번호 입력·키워드 목록에서 여는 경우: 저장된 작업이 있을 때만 묻고, 없으면 바로 조회한다(사용자가 직접 고른 공고라서)
  function startNotice(no) {
    no = String(no).trim().toUpperCase();
    var info = workInfo(no);
    if (!info || (S.no === no && S.notice)) { if (S.no === no && S.notice) go(CURSTEP === 'home' ? 'search' : CURSTEP); else openNotice(no); return; }
    showAsk('이 공고로 저장된 작업이 있습니다. 이어서 하시겠습니까?', no + '\n저장된 작업: ' + info.label, [
      { label: '취소' },
      { label: '처음부터 다시', fn: function () { openNotice(no); } },
      { label: '저장된 작업 이어서', primary: true, fn: function () { resumeWork(no); } }
    ]);
  }
  var ASK = [];
  function showAsk(title, desc, btns) {
    ASK = btns;
    $('ask-t').textContent = title; $('ask-d').textContent = desc;
    $('ask-b').innerHTML = btns.map(function (b, i) { return '<button class="btn ' + (b.primary ? 'primary' : 'soft') + '" style="flex:0 0 auto;" onclick="askDo(' + i + ')">' + esc(b.label) + '</button>'; }).join('');
    $('ask').hidden = false;
    var last = $('ask-b').lastChild; if (last) last.focus();
  }
  function closeAsk() { $('ask').hidden = true; ASK = []; }
  function askDo(i) { var b = ASK[i]; closeAsk(); if (b && b.fn) b.fn(); }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('ask').hidden) closeAsk(); });

  // 저장된 작업 복원. 서버를 부르지 않고 저장해 둔 공고·계보·검색 결과·선택·작성칸을 그대로 되살린다
  function resumeWork(no) {
    var w = loadWork(no);
    if (!w) { openNotice(no); return; }
    saveWork();
    ++seq;
    S = w.S; CARDS = w.CARDS || []; cur = w.cur || 0; HEAD = w.HEAD || {}; CONCL = w.CONCL || '';
    AIF = w.AIF || { head: {}, concl: false }; COPY = w.COPY || null; SWAP = null;
    DECKHL = w.DECKHL || ['', '']; if (w.hlEdited) DECKHL.edited = true; DECKSEL = w.DECKSEL || '';
    MSIT = w.MSIT || { key: '', items: [], loose: [] }; AI.sug = w.sug || [];
    DECK = null; DRAFT = null; draftKey = ''; V = { key: '', data: null, page: 0 };
    lastWork = JSON.stringify(Object.assign({}, w, { at: 0 }));
    $('deck-h1').value = DECKHL[0]; $('deck-h2').value = DECKHL[1];
    if (w.PAL) setPal(w.PAL);
    $('no-view').textContent = S.no; $('no-label').textContent = '공고번호';
    renderNotice(); renderRfp(); renderLineage(); renderTerms(); renderSug();
    renderResults({ scopeDocs: S.scopeDocs || 0 });
    if (MSIT.key && isMsitLine()) { $('msit-box').style.display = ''; renderMsit({ ok: true, pool: MSIT.pool }); } else $('msit-box').style.display = 'none';
    $('search-main').style.display = ''; setState('');
    saveRecent(S.notice);
    go(w.step || 'search');
  }
  function renderRecent() {
    var list = loadRecent();
    $('side-recent-label').style.display = list.length ? '' : 'none';
    $('side-recent').innerHTML = list.slice(0, 5).map(function (x) {
      return '<button class="recent" onclick="pickRecent(\'' + esc(x.no) + '\')">' + ICON_SEARCH + esc(x.no) + '</button>';
    }).join('');
    $('home-recent').innerHTML = !list.length ? '' :
      '<div class="sec-label">최근 검색</div><div class="rows">' + list.map(function (x) {
        var w = workInfo(x.no);
        return '<button class="row" onclick="pickRecent(\'' + esc(x.no) + '\')"><span class="no">' + esc(x.no) + '</span><span class="nm">' + esc(x.name) + '</span><span class="meta ag">' + esc(x.org) + '</span><span class="st">' + (w ? '<span class="meta">저장된 작업 · ' + esc(w.label) + '</span>' : '') + '</span></button>';
      }).join('') + '</div>';
  }

  /* ---------- 정책 근거 검색 ---------- */
  var S = { no: '', notice: null, lineage: null, terms: [], scope: 'lineage', results: [], rfp: { state: 'none' } };
  var seq = 0;

  /* ---------- 공고 찾기: 대상(입찰공고·사전규격) × 방법(번호·키워드) ---------- */
  var FIND = {
    bid: { no: ['공고번호', '예: R26BK00412587'], kw: '공고명 키워드 (예: AI 교육, 연수)', days: [7, 14, 30] },
    spec: { no: ['규격번호', '예: R26BD00276609'], kw: '규격명 키워드 (예: 교육, 연수)', days: [7, 14, 21] }
  };
  var BIDS = [];
  function findMode(reset) {
    var t = $('f-target').value, m = $('f-mode'), f = FIND[t];
    m.options[0].textContent = f.no[0];
    var kw = m.value === 'kw', inp = $('no-input');
    inp.placeholder = kw ? f.kw : f.no[1];
    inp.setAttribute('aria-label', kw ? '검색어' : f.no[0]);
    var keep = $('f-days').value;
    $('f-days').innerHTML = f.days.map(function (d) { return '<option value="' + d + '">최근 ' + d + '일</option>'; }).join('');
    $('f-days').value = f.days.indexOf(Number(keep)) >= 0 ? keep : String(f.days[1]);
    $('find-opts').classList.toggle('on', kw);
    $('f-days').style.display = kw ? '' : 'none';
    if (reset) { $('find-list').innerHTML = ''; findState(kw ? (t === 'bid' ? '나라장터 용역 입찰공고 + 산하기관 게시판 공고(한국과학창의재단·정보통신산업진흥원 사업공고, 한국교육학술정보원 공지) · 공고명에 검색어가 든 것 (쉼표로 여러 개)' : '나라장터 용역 사전규격 · 공고 전에 공개된 제안요청서·과업지시서를 읽습니다') : ''); }
  }
  function findState(msg, isErr) {
    $('find-state').textContent = msg || '';
    $('find-state').className = 'meta' + (isErr ? ' err' : '');
    if ($('f-mode').value !== 'kw') $('find-opts').classList.toggle('on', !!msg);
  }
  function submitFind(e) {
    e.preventDefault();
    var t = $('f-target').value, kw = $('f-mode').value === 'kw', v = $('no-input').value.trim();
    if (!kw && !v) return;
    // 입찰공고 번호칸에 한국과학창의재단 사업공고 번호(2026-P094)를 넣으면 그 공고를 찾는다
    if (t === 'bid') { if (kw) loadBids(v); else if (/^\d{4}-P\d+$/i.test(v)) loadAgency('', v); else startNotice(v); }
    else { if (kw) loadSpec(v); else openSpecNo(v); }
  }
  // 나라장터 용역 입찰공고와 산하기관 게시판 공고(나라장터에 올라오지 않는 운영기관·수행기관 공모, 연수 사업 모집)를 함께 찾아 날짜순으로 섞는다.
  // 게시판 공고는 선택한 기간과 상관없이 최근 6개월치(서버에서 자름). 지난 공고도 참고로 본다. 사업공고를 못 불러와도 입찰공고는 그대로 보여 준다
  function loadBids(q) {
    var days = $('f-days').value;
    findState('입찰공고를 찾는 중'); $('find-list').innerHTML = '';
    Promise.all([
      api('/api/bids', { q: q, days: days, limit: '20' }),
      api('/api/boards', { q: q, limit: '50' }).catch(function () { return { ok: false }; })
    ]).then(function (r) {
      var d = r[0], k = r[1];
      if (!d.ok && !k.ok) { findState(d.error || '불러오지 못했습니다.', true); return; }
      BIDS = d.ok ? d.items : [];
      AGN = k.ok ? k.items : [];
      var rows = BIDS.map(function (x) { return { at: x.postedAt || '', html: bidRow(x) }; })
        .concat(AGN.map(function (x, i) { return { at: x.postedAt || '', html: agencyRow(x, i) }; }))
        .sort(function (a, b) { return b.at.localeCompare(a.at); });
      findState('최근 ' + days + '일 용역 입찰공고 ' + BIDS.length + '건' + (AGN.length ? ' · 기관 게시판 공고(최근 6개월) ' + AGN.length + '건' : '') + (q ? ' (검색어: ' + q + ')' : '') +
        (d.capped ? ' · 결과가 많아 최근 공고 위주로 봅니다' : '') + (!d.ok ? ' · 나라장터를 불러오지 못했습니다' : '') + (!k.ok ? ' · 기관 게시판 공고는 불러오지 못했습니다' : (k.failed || []).map(function (f) { return ' · ' + f.org + ' 게시판은 불러오지 못했습니다'; }).join('')));
      $('find-list').innerHTML = rows.map(function (x) { return x.html; }).join('') || '<div class="meta">맞는 공고가 없습니다.</div>';
    }).catch(function () { findState('서버에 연결하지 못했습니다.', true); });
  }
  function bidRow(x) {
    return '<div class="spec-item"><div class="nm">' + esc(x.name) + '</div>' +
      '<span class="meta">' + esc(x.org) + (x.budget ? ' \u00b7 ' + won(x.budget) : '') +
      (x.closeAt ? ' \u00b7 마감 ' + esc(x.closeAt.slice(0, 10)) : '') + ' \u00b7 ' + esc(x.no) + '</span>' +
      '<div class="acts"><button class="btn soft mini" onclick="startNotice(\'' + esc(x.no) + '\')">이 공고로 시작</button></div></div>';
  }
  function setState(msg, isErr) {
    $('search-state').style.display = msg ? '' : 'none';
    $('search-state').className = 'state-msg' + (isErr ? ' err' : '');
    $('search-state').textContent = msg || '';
  }

  function openNotice(no) {
    saveWork(); lastWork = '';
    var my = ++seq;
    S = { no: no.toUpperCase(), notice: null, lineage: null, terms: [], scope: 'lineage', results: [], rfp: { state: 'none' } };
    CARDS = []; HEAD = {}; CONCL = ''; cur = 0; MSIT = { key: '', items: [], loose: [] }; $('msit-box').style.display = 'none';
    AIF = { head: {}, concl: false }; COPY = null; DECKHL = ['', '']; SWAP = null; DECKSEL = '';
    $('no-view').textContent = S.no; $('no-label').textContent = '공고번호';
    $('search-main').style.display = 'none';
    setState('공고를 조회하고 있습니다.');
    go('search');

    api('/api/notice', { no: S.no }).then(function (d) {
      if (my !== seq) return;
      if (!d.ok) { setState(d.error || '공고를 조회하지 못했습니다.', true); return; }
      S.notice = d.notice;
      saveRecent(d.notice);
      renderNotice();
      autoRfp(my);
      $('search-main').style.display = '';
      setState('');
      $('lineage-card').innerHTML = '<div class="meta">확인 중</div>';
      $('result-grid').innerHTML = ''; $('terms').innerHTML = ''; $('result-count').textContent = '';
      return api('/api/lineage', { name: d.notice.demandOrg }).then(function (l) {
        if (my !== seq) return;
        S.lineage = l.ok ? l : { chain: [{ name: d.notice.demandOrg, role: '발주처' }], orgs: [d.notice.demandOrg], source: 'none', error: l.error };
        renderLineage();
        return runEvidence(true);
      });
    }).catch(function () { if (my === seq) setState('서버에 연결하지 못했습니다.', true); });
  }

  function won(n) { return n ? Number(n).toLocaleString('ko-KR') + '원' : '-'; }
  function renderNotice() {
    var n = S.notice;
    var files = n.files.map(function (f) {
      return '<a class="chip" href="' + esc(f.url) + '" target="_blank" rel="noopener">' + ICON_FILE + '<span>' + esc(f.name) + '</span></a>';
    }).join('');
    var link = n.detailUrl ? '<a class="chip" href="' + esc(n.detailUrl) + '" target="_blank" rel="noopener">' + ICON_OPEN + '<span>' + esc(n.detailLabel || '나라장터 공고') + '</span></a>' : '';
    $('notice-card').innerHTML =
      '<div><div class="k">공고명</div><div class="v">' + esc(n.name) + '</div></div>' +
      '<div><div class="k">' + (n.manual ? '발주기관' : '수요기관') + '</div><div class="v">' + esc(n.demandOrg) + '</div></div>' +
      (n.manual ? '' :
      '<div><div class="k">' + (n.budget ? '배정예산' : '추정가격') + '</div><div class="v">' + won(n.budget || n.estimatedPrice) + '</div></div>' +
      '<div><div class="k">입찰마감</div><div class="v">' + esc((n.closeAt || '-').slice(0, 16)) + '</div></div>') +
      (files || link ? '<div class="files">' + link + files + '</div>' : '');
  }

  function renderLineage() {
    var arrow = '<div style="display:flex;justify-content:center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#66717E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></div>';
    var l = S.lineage;
    // 기관별 색인 문서 수(누락 위험). 학교·대학 자체 문서는 원래 드물어 경고하지 않는다
    var cov = {}; (S.coverage || []).forEach(function (x) { cov[x.name] = x; });
    var missing = [];
    var html = l.chain.map(function (c, i) {
      var x = cov[c.name], badge = '';
      if (x) {
        var school = /학교$|대학$|대학교$|산학협력단$/.test(c.name) || /학교|대학/.test(c.role || '');
        if (x.count) badge = '<span class="cov">색인 문서 ' + x.count + '건' + (x.latest ? ' · 최신 ' + esc(x.latest) : '') + '</span>';
        else if (!school) { badge = '<span class="cov none">색인 문서 없음</span>'; missing.push(c.name); }
      }
      return '<div class="node' + (i === 0 ? ' first' : '') + '">' + esc(c.name) + '<small>' + esc(c.role) + '</small>' + badge + '</div>';
    }).join(arrow);
    if (l.source === 'none') html += '<div class="meta" style="padding:4px 2px 0;">' + esc(l.error || '상위 기관을 찾지 못했습니다.') + '</div>';
    if (missing.length) html += '<div class="cov-warn">추가 권장: ' + missing.map(esc).join(', ') + '의 업무계획·사업계획 문서. 정책문서 드라이브 폴더에 넣으면 다음 날 검색에 반영됩니다.</div>';
    $('lineage-card').innerHTML = html;
  }

  function evParams() { return { title: S.notice.name, orgs: S.lineage.orgs.join(','), ministry: S.lineage.ministry || '', scope: S.scope }; }
  function runEvidence(fresh) {
    var my = seq;
    var params = evParams();
    $('ai-rank-msg').textContent = '';
    if (!fresh) params.terms = S.terms.join(',');
    else { AI.sug = []; renderSug(); }
    $('result-count').textContent = '검색 중';
    $('to-review').disabled = true;
    return api('/api/evidence', params).then(function (d) {
      if (my !== seq) return;
      if (!d.ok) { $('result-count').textContent = ''; $('result-grid').innerHTML = '<div class="state-msg err">' + esc(d.error || '검색하지 못했습니다.') + '</div>'; return; }
      S.terms = d.terms; S.results = d.results; S.scopeDocs = d.scopeDocs;
      if (d.coverage) { S.coverage = d.coverage; renderLineage(); }
      renderTerms(); renderResults(d);
      loadMsit();
      mergeRfpTerms();
    });
  }

  // 검색어별 결과 카드 수. 0건인 검색어는 흐리게 → 10개가 찼을 때 바꿀 후보가 보인다
  function termHits(t) {
    var k = String(t).toLowerCase();
    return (S.results || []).filter(function (r) { return (r.matched || []).some(function (m) { return String(m).toLowerCase() === k; }); }).length;
  }
  var SWAP = null;   // 10개가 찬 상태에서 새 검색어를 넣으려 할 때 { term, sug: AI 추천 번호 }
  function renderTerms() {
    var fromRfp = (S.rfp && S.rfp.terms) || [];
    var counted = (S.results || []).length > 0;
    $('terms').innerHTML = S.terms.map(function (t, i) {
      var n = counted ? termHits(t) : -1, cls = 'chip term' + (fromRfp.indexOf(t) >= 0 ? ' rfp' : '') + (n === 0 ? ' weak' : '') + (SWAP ? ' swap' : '');
      return '<span class="' + cls + '"' + (SWAP ? ' role="button" onclick="swapTerm(' + i + ')"' : '') + (fromRfp.indexOf(t) >= 0 ? ' title="제안요청서에서 뽑은 검색어"' : '') + '>' + esc(t) +
        (SWAP && n >= 0 ? '<span class="n">' + n + '건</span>' : '') +
        '<button aria-label="' + esc(t) + ' 삭제" onclick="event.stopPropagation();removeTerm(' + i + ')">×</button></span>';
    }).join('') +
      '<form onsubmit="addTerm(event)" style="display:inline-flex;"><input id="term-input" placeholder="' + (S.terms.length >= MAX_TERMS ? '검색어 교체' : '검색어 추가') + '" aria-label="검색어 추가"></form>' +
      '<button class="ai-btn" id="ai-terms-btn" onclick="aiTerms()">AI 검색어 추천</button><span class="ai-msg" id="ai-terms-msg"></span>' +
      '<span class="scope"><button class="' + (S.scope === 'lineage' ? 'on' : '') + '" onclick="setScope(\'lineage\')">유관기관 문서</button><button class="' + (S.scope === 'all' ? 'on' : '') + '" onclick="setScope(\'all\')">관련 정책문서 전체</button></span>' +
      (SWAP ? '<span class="swap-note">검색어는 ' + MAX_TERMS + '개까지입니다. ‘' + esc(SWAP.term) + '’ 대신 뺄 검색어를 누르세요 (건수 = 지금 결과에서 그 검색어가 걸린 카드 수)<button onclick="cancelSwap()">취소</button></span>' : '');
  }
  function removeTerm(i) { SWAP = null; S.terms.splice(i, 1); runEvidence(false); }
  function addTerm(e) {
    e.preventDefault();
    var v = $('term-input').value.trim();
    if (!v || S.terms.indexOf(v) >= 0) { $('term-input').value = ''; return; }
    if (S.terms.length >= MAX_TERMS) { SWAP = { term: v, sug: -1 }; renderTerms(); return; }
    S.terms.push(v); runEvidence(false);
  }
  function swapTerm(i) {
    if (!SWAP) return;
    var t = SWAP.term, k = SWAP.sug;
    SWAP = null;
    if (k >= 0 && AI.sug[k] && AI.sug[k].term === t) { AI.sug.splice(k, 1); renderSug(); }
    if (S.terms.indexOf(t) < 0) S.terms[i] = t;
    runEvidence(false);
  }
  function cancelSwap() { SWAP = null; renderTerms(); }
  function setScope(v) { if (S.scope !== v) { S.scope = v; runEvidence(false); } }

  function mark(text, terms) {
    var out = esc(text);
    terms.slice().sort(function (a, b) { return b.length - a.length; }).forEach(function (t) {
      // 띄어쓰기를 무시하고 칠한다("디지털새싹" 검색어가 원문 "디지털 새싹"에도 칠해지게. 검색도 같은 방식)
      var pat = Array.from(String(t).replace(/\s+/g, '')).map(function (ch) { return esc(ch).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('\\s*');
      if (!pat) return;
      var re = new RegExp('(' + pat + ')(?![^<]*>)', 'gi');
      out = out.replace(re, '<span class="hl">$1</span>');
    });
    return cells(out);
  }
  // 표 행의 칸 구분(색인의 EN SPACE)을 얇은 세로선으로 그린다. 글자 위치는 그대로라 발췌·대조에 영향 없음
  function cells(html) { return String(html).replace(/\u2002/g, '<span class="cs">\u2002</span>'); }
  function pageLabel(r) { return 'p.' + r.page + (r.pageEstimated ? ' (추정)' : ''); }
  function sourceButtons(r) {
    return r.url
      ? '<a class="btn soft mini" href="' + esc(r.url) + '" target="_blank" rel="noopener" style="text-decoration:none;">' + ICON_OPEN + '원문 열기</a>'
      : '<span class="meta" style="word-break:break-all;">' + esc(r.file) + '</span>';
  }

  function renderResults(d) {
    $('result-count').textContent = S.results.length + '건 · 대상 문서 ' + d.scopeDocs + '건';
    syncCards();
    if (!S.results.length) {
      $('result-grid').innerHTML = '<div class="state-msg" style="grid-column:1/-1;">' +
        (d.scopeDocs ? '일치하는 근거가 없습니다. 검색어를 바꾸거나 관련 정책문서 전체로 넓혀 보세요.' : '유관기관 문서가 아직 없습니다. 관련 정책문서 전체로 넓혀 보세요.') + '</div>';
      return;
    }
    renderGrid(); repaintSteps();
  }
  function renderGrid() {
    $('result-grid').innerHTML = S.results.map(function (r, i) {
      var c = cardOf(r.id), on = c && c.sel;
      return '<div class="card' + (on ? ' sel' : '') + '">' +
        '<div style="display:flex;align-items:flex-start;gap:6px;margin-bottom:6px;">' + ICON_DOC + '<div class="doc-title" style="flex:1;">' + esc(r.org + ' ' + r.title) + '</div>' +
        '<button class="pick' + (on ? ' on' : '') + '" onclick="toggleSel(\'' + esc(r.id) + '\')"><i></i>선택</button></div>' +
        '<div class="meta" style="margin-bottom:10px;">' + esc(r.year) + ' · ' + pageLabel(r) + '</div>' +
        (r.aiScore ? '<div class="ai-rank"><b title="관련도 ' + r.aiScore + '/3">' + '●●●'.slice(0, r.aiScore) + '<span style="opacity:.25">' + '●●●'.slice(r.aiScore) + '</span></b>' + esc(r.aiWhy || '') + '</div>' : '') +
        '<div class="quote" style="margin-bottom:12px;">' + mark(r.quote, r.matched) + '</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;">' + sourceButtons(r) + '</div>' +
      '</div>';
    }).join('');
    renderPickCount();
  }

  /* ---------- 과기정통부 게시판(주요정책·사업공고·보도자료·보도설명) ---------- */
  // 계보에 과학기술정보통신부가 있으면, 최근 게시물 중 제목이 검색어와 맞는 것을 상세페이지·첨부와 함께 보여 준다.
  // 첨부(hwpx·hwp·pdf·odt·docx)는 "검색어 보강"으로 제안요청서처럼 본문을 읽어 검색어를 더할 수 있다.
  var MSIT = { key: '', items: [], loose: [] };
  function isMsitLine() {
    return !!(S.lineage && (S.lineage.chain || []).some(function (c) { return /과학기술정보통신부|과기정통부/.test(c.name); }));
  }
  function loadMsit() {
    if (!isMsitLine() || !S.terms.length) { $('msit-box').style.display = 'none'; return; }
    var key = S.terms.join(',');
    if (key === MSIT.key) return;
    MSIT.key = key;
    var my = seq;
    $('msit-box').style.display = '';
    $('msit-box').innerHTML = '<div class="msit-head"><span class="k">과기정통부 게시물</span><span class="meta">불러오는 중</span></div>';
    api('/api/msit', { terms: key }).then(function (d) {
      if (my !== seq || key !== MSIT.key) return;
      MSIT.items = d.ok ? d.items : []; MSIT.loose = d.ok ? (d.loose || []) : []; MSIT.pool = d.pool;
      renderMsit(d);
    }).catch(function () { if (my === seq) renderMsit({ ok: false, error: '서버에 연결하지 못했습니다.' }); });
  }
  function msitRow(it, i, list) {

          (f.readable ? '<button class="btn soft mini" onclick="msitTerms(\'' + list + '\',' + i + ',' + j + ')">검색어 보강</button>' : '');

  }
  function renderMsit(d) {
    var head = '<div class="msit-head"><span class="k">과기정통부 게시물</span><span class="meta">주요정책 · 사업공고 · 보도자료 · 보도설명</span></div>';

  function msitTerms(list, i, j) {
    var src = MSIT[list] || [];

    var my = seq;
    var prev = (S.rfp && (S.rfp.terms || S.rfp.prev)) || [];
    S.rfp = { state: 'loading', name: f.name, prev: prev, src: 'msit' }; renderRfp();
    api('/api/rfp', { url: f.url, name: f.name, title: S.notice.name }).then(function (d) { if (my === seq) gotRfp(d, f.name, 'msit'); })
      .catch(function () { if (my === seq) gotRfp({ ok: false, error: '서버에 연결하지 못했습니다.' }, f.name); });

  /* ---------- 제안요청서 ---------- */
  // 공고 첨부파일 중 제안요청서를 골라 서버가 받아 읽는다. 실패하면 직접 올린다. 파일은 어디에도 저장하지 않는다.
  var RFP_NAME = /제안\s*요청서|과업\s*지시서|과업\s*내용서|과업\s*내용|RFP/i;
  var MAX_UPLOAD = 4 * 1024 * 1024;   // 서버리스 요청 크기 한도(4.5MB) 아래로
  function pickRfpFile(files) {
    // 나라장터 "제안요청정보"에서 온 파일은 문서 구분(doc)이 붙어 온다. 제안요청서 구분 > 이름 매칭, 같은 조건이면 pdf > hwpx > hwp
    var c = (files || []).filter(function (f) { return f.doc === '제안요청서' || RFP_NAME.test(f.name); });
    var rank = function (f) { var n = f.name.toLowerCase(); return (f.doc === '제안요청서' && RFP_NAME.test(f.name) ? 0 : f.doc === '제안요청서' ? 4 : 8) + (/\.pdf$/.test(n) ? 0 : /\.hwpx$/.test(n) ? 1 : /\.hwp$/.test(n) ? 2 : 3); };
    return c.sort(function (a, b) { return rank(a) - rank(b); })[0] || null;
  }
  function renderRfp() {
    var r = S.rfp || { state: 'none' };
    var up = '<button class="btn soft mini" onclick="$(\'rfp-file\').click()">' + (r.state === 'ok' ? '다른 파일 올리기' : '파일 올리기') + '</button>';
    var msg = {
      none: '<span class="msg meta">첨부파일에서 찾지 못했습니다.</span>',
      loading: '<span class="msg meta">' + esc(r.name || '') + ' 읽는 중</span>',
      ok: '<span class="msg">' + ICON_OK + ' ' + esc(r.name) + ' · 검색어 ' + (r.terms || []).length + '개 반영</span>',

    api('/api/rfp', { url: f.url, name: f.name, title: S.notice.name }).then(function (d) { if (my === seq) gotRfp(d, f.name); })
      .catch(function () { if (my === seq) gotRfp({ ok: false, error: '서버에 연결하지 못했습니다.' }, f.name); });
  }
  function postRfp(file, title) {
    if (file.size > MAX_UPLOAD) return Promise.resolve({ ok: false, error: '4MB가 넘는 파일은 올릴 수 없습니다. 제안요청서 부분만 PDF로 저장해 올려 주세요.' });
    var q = 'name=' + encodeURIComponent(file.name) + '&title=' + encodeURIComponent(title || '');
    return fetch('/api/rfp?' + q, { method: 'POST', body: file }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: r.status === 413 ? '파일이 너무 큽니다.' : '응답을 읽지 못했습니다.' }; });
    }).catch(function () { return { ok: false, error: '서버에 연결하지 못했습니다.' }; });
  }
  function uploadRfp(file) {
    if (!file || !S.notice) return;
    var my = seq;
    var prev = (S.rfp && (S.rfp.terms || S.rfp.prev)) || [];
    S.rfp = { state: 'loading', name: file.name, prev: prev }; renderRfp();
    postRfp(file, S.notice.name).then(function (d) { if (my === seq) gotRfp(d, file.name); });
  }
  function gotRfp(d, name, src) {
    var old = (S.rfp && (S.rfp.prev || S.rfp.terms)) || [];

  }
  var MAX_TERMS = 10;   // 검색어는 모두 합쳐 10개까지(공고명 최대 6 + 나머지는 제안요청서). lib/search.js 와 같게 유지
  function mergeRfpTerms() {

    r.terms = add;   // 실제로 들어간 것만 제안요청서 검색어로 표시

  }

  /* 나라장터 밖 사업: 제안요청서 + 사업명·발주기관으로 시작 */
  var MN = null;

  /* ---------- 사전규격(공고 전 단계) ---------- */

  var SPEC = [];

  function openSpecNo(no) {

      return '<div class="spec-item"><div class="nm">' + esc(x.name) + '</div>' +

  /* ---------- 산하기관 게시판 공고(한국과학창의재단·정보통신산업진흥원 사업공고, 한국교육학술정보원 공지) ---------- */
  // 나라장터에 없는 운영기관·수행기관 공모와 연수 사업 모집. 첨부의 제안요청서(없으면 공고문, 첨부가 없으면 게시글 본문)를 읽어 사전규격처럼 공고번호 없이 시작한다

  // 공고번호(2026-P094)로 찾을 때
