name: 산하기관 게시판 중복 조사(일회성)
on:
  workflow_dispatch:   # Actions 탭에서 수동 실행. 클라우드 작업 환경은 기관 사이트가 막혀 여기서 돌린다
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe_board_overlap.mjs
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
