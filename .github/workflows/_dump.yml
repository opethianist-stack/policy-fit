  push:
    branches: [claude/bold-bardeen-l00afw]
    paths: [scripts/_dump_kosac.mjs]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
